# Coolify deployment for https://ig.nabuxai.com
# Assign the mcp service the domain ig.nabuxai.com on container port 8000.
services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_NAME=${APP_NAME:-Instagram MCP by Nabux}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://ig.nabuxai.com}
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - IG_APP_ID=${IG_APP_ID}
      - IG_APP_SECRET=${IG_APP_SECRET}
      - IG_REDIRECT_URI=${IG_REDIRECT_URI:-https://ig.nabuxai.com/instagram/callback}
      - IG_GRAPH_VERSION=${IG_GRAPH_VERSION:-v26.0}
      - IG_SCOPES=${IG_SCOPES:-instagram_business_basic,instagram_business_content_publish,instagram_business_manage_comments,instagram_business_manage_messages,instagram_business_manage_insights}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - IG_WEBHOOK_VERIFY_TOKEN=${IG_WEBHOOK_VERIFY_TOKEN}
      - NABUCRM_INBOUND_URL=${NABUCRM_INBOUND_URL}
      - CRM_INTAKE_URL=${CRM_INTAKE_URL:-https://crm.nabuxai.com/api/v1/crm/intake}
      - CRM_INTAKE_ENABLED=${CRM_INTAKE_ENABLED:-true}
      - NABUGATE_SECRET=${NABUGATE_SECRET}
      - FB_APP_ID=${FB_APP_ID}
      - FB_APP_SECRET=${FB_APP_SECRET}
      - META_RELAY_TARGETS=${META_RELAY_TARGETS}
      - NABUAUTH_URL=${NABUAUTH_URL:-https://auth.nabuxai.com}
      - NABUAUTH_CLIENT_ID=${NABUAUTH_CLIENT_ID:-}
      - NABUAUTH_CLIENT_SECRET=${NABUAUTH_CLIENT_SECRET:-}
      - NABUAUTH_REDIRECT_URI=${NABUAUTH_REDIRECT_URI:-}
      - POSTIZ_FRONTEND_URL=${POSTIZ_FRONTEND_URL:-}
      - POSTIZ_API_URL=${POSTIZ_API_URL:-}
      - POSTIZ_CLIENT_ID=${POSTIZ_CLIENT_ID:-}
      - POSTIZ_CLIENT_SECRET=${POSTIZ_CLIENT_SECRET:-}
      - DATA_DIR=/data
      # /data/media is on the persistent volume below. Do not leave MEDIA_DIR
      # on the container filesystem. Also raise any nginx body limit
      # (client_max_body_size) to at least MEDIA_MAX_BYTES; Traefik has none.
      - MEDIA_DIR=/data/media
      - MEDIA_MAX_BYTES=${MEDIA_MAX_BYTES:-1073741824}
      - SCHEDULE_MAX_ATTEMPTS=${SCHEDULE_MAX_ATTEMPTS:-5}
      - STAGED_MEDIA_TTL=${STAGED_MEDIA_TTL:-14400}
      - STAGED_VIDEO_MAX_BYTES=${STAGED_VIDEO_MAX_BYTES:-104857600}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-3600}
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-7776000}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT:-45}
    volumes:
      - instagram-mcp-data:/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  instagram-mcp-data:
